<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<link rel="manifest" href="/manifest.webmanifest" />
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
		<meta name="apple-mobile-web-app-title" content="Kiso" />
		<link rel="apple-touch-icon" href="/icon-192.png" />
		<meta name="theme-color" content="#b23a1f" media="(prefers-color-scheme: light)" />
		<meta name="theme-color" content="#0f172a" media="(prefers-color-scheme: dark)" />
		<script>
			try {
				const savedTheme = localStorage.getItem('kisocrm-theme');
				const useDarkTheme =
					savedTheme === 'dark' ||
					(!savedTheme && window.matchMedia('(prefers-color-scheme: dark)').matches);
				document.documentElement.classList.toggle('dark', useDarkTheme);
				document.documentElement.style.colorScheme = useDarkTheme ? 'dark' : 'light';
			} catch {
				// Keep the server-rendered light theme when browser storage is unavailable.
			}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
