name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check, unit tests, build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: transmit
          POSTGRES_PASSWORD: transmit
          POSTGRES_DB: transmit
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U transmit -d transmit"
          --health-interval 2s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgres://transmit:transmit@127.0.0.1:5432/transmit
      TEST_DATABASE_URL: postgres://transmit:transmit@127.0.0.1:5432/transmit_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Create the test database
        run: PGPASSWORD=transmit psql -h 127.0.0.1 -U transmit -d transmit -c 'create database transmit_test'
      - run: pnpm check
      - run: pnpm test:unit
      - run: pnpm build

  e2e:
    name: Playwright and Axe
    runs-on: ubuntu-latest
    needs: check
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: transmit
          POSTGRES_PASSWORD: transmit
          POSTGRES_DB: transmit
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U transmit -d transmit"
          --health-interval 2s --health-timeout 5s --health-retries 20
    env:
      CI: 'true'
      DATABASE_URL: postgres://transmit:transmit@127.0.0.1:5432/transmit
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: test-results
          retention-days: 7

  image:
    name: Container image
    runs-on: ubuntu-latest
    needs: check
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Sign in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build (and push on main)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: |
            ghcr.io/${{ github.repository }}:main
            ghcr.io/${{ github.repository }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
