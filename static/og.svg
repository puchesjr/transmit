<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title description">
  <title id="title">Kiso CRM — Turn missed calls into booked work</title>
  <desc id="description">Kiso CRM branding with a stylized shared inbox and customer message flow.</desc>
  <defs>
    <linearGradient id="warm" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fffcf7"/>
      <stop offset="1" stop-color="#f1e8db"/>
    </linearGradient>
    <linearGradient id="vermillion" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c64a2a"/>
      <stop offset="1" stop-color="#9d2f19"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#211d1a"/>
      <stop offset="1" stop-color="#0c0a09"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#111827" flood-opacity=".2"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#warm)"/>
  <circle cx="42" cy="590" r="2" fill="#c64a2a" opacity=".28"/>
  <circle cx="74" cy="590" r="2" fill="#c64a2a" opacity=".18"/>
  <circle cx="106" cy="590" r="2" fill="#c64a2a" opacity=".1"/>

  <g transform="translate(44 40)">
    <rect width="42" height="42" rx="10" fill="#211d1a"/>
    <circle cx="21" cy="21" r="13.5" fill="none" stroke="#c64a2a" stroke-width="2.8"/>
    <path d="M14.8 12.5v17M15.8 21h3l8.5-8.5M18.8 21l8.5 8.5" fill="none" stroke="#fff8ed" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="18.8" cy="21" r="1.4" fill="#d0a058"/>
    <text x="56" y="31" fill="#211d1a" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="28" font-weight="760" letter-spacing="-1">Kiso CRM</text>
  </g>

  <g fill="#211d1a" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-weight="780" letter-spacing="-4">
    <text x="44" y="205" font-size="82">Turn missed</text>
    <text x="44" y="292" font-size="82">calls into</text>
    <text x="44" y="379" fill="#a6351b" font-size="82">booked work.</text>
  </g>
  <text x="48" y="434" fill="#625b55" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="22" font-weight="560">Shared inbox  •  Two-way SMS  •  Missed-call textback</text>
  <g transform="translate(48 482)" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <rect width="286" height="54" rx="27" fill="#211d1a"/>
    <circle cx="30" cy="27" r="8" fill="#c64a2a"/>
    <text x="52" y="35" fill="#fff" font-size="17" font-weight="680">Built for home-service teams</text>
  </g>

  <g transform="translate(626 30)" filter="url(#shadow)">
    <rect width="610" height="590" rx="32" fill="url(#panel)"/>
    <rect x="24" y="24" width="562" height="542" rx="24" fill="none" stroke="#c64a2a" stroke-opacity=".34"/>

    <g transform="translate(48 68)">
      <text x="0" y="0" fill="#f8fafc" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" font-weight="700">Inbox</text>
      <text x="0" y="25" fill="#8d929d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12">Every lead, one calm queue.</text>
    </g>

    <g transform="translate(48 122)">
      <rect width="218" height="360" rx="18" fill="#1f222a"/>
      <g transform="translate(16 18)">
        <rect width="186" height="62" rx="14" fill="#302a25" stroke="#c64a2a" stroke-opacity=".55"/>
        <circle cx="25" cy="31" r="14" fill="#c64a2a" fill-opacity=".16"/>
        <text x="20" y="36" fill="#f18b67" font-family="Inter, sans-serif" font-size="13" font-weight="700">J</text>
        <rect x="50" y="18" width="82" height="8" rx="4" fill="#f7f7f8" fill-opacity=".86"/>
        <rect x="50" y="36" width="110" height="7" rx="3.5" fill="#8d929d" fill-opacity=".6"/>
      </g>
      <g fill="#2a2d35">
        <rect x="16" y="96" width="186" height="58" rx="14"/>
        <rect x="16" y="170" width="186" height="58" rx="14"/>
        <rect x="16" y="244" width="186" height="58" rx="14"/>
      </g>
      <g fill="#5f646e" opacity=".75">
        <rect x="66" y="114" width="92" height="7" rx="3.5"/>
        <rect x="66" y="132" width="70" height="7" rx="3.5"/>
        <rect x="66" y="188" width="102" height="7" rx="3.5"/>
        <rect x="66" y="206" width="64" height="7" rx="3.5"/>
        <rect x="66" y="262" width="84" height="7" rx="3.5"/>
        <rect x="66" y="280" width="108" height="7" rx="3.5"/>
      </g>
    </g>

    <g transform="translate(292 122)">
      <rect width="270" height="360" rx="18" fill="#15171d"/>
      <rect x="24" y="30" width="206" height="66" rx="16" fill="#f8f4ee"/>
      <path d="M38 91 26 108l30-12z" fill="#f8f4ee"/>
      <rect x="48" y="50" width="132" height="8" rx="4" fill="#b8b2aa"/>
      <rect x="48" y="69" width="88" height="7" rx="3.5" fill="#d2ccc4"/>

      <rect x="50" y="124" width="196" height="72" rx="16" fill="url(#vermillion)"/>
      <path d="m230 188 22 12-6-25z" fill="#9d2f19"/>
      <rect x="72" y="147" width="138" height="8" rx="4" fill="#fff" fill-opacity=".7"/>
      <rect x="72" y="167" width="94" height="7" rx="3.5" fill="#fff" fill-opacity=".52"/>

      <rect x="24" y="230" width="222" height="92" rx="18" fill="#f8f4ee"/>
      <circle cx="56" cy="276" r="20" fill="#c64a2a"/>
      <path d="m47 276 7 7 13-15" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="88" y="259" width="116" height="8" rx="4" fill="#b8b2aa"/>
      <rect x="88" y="281" width="78" height="7" rx="3.5" fill="#d2ccc4"/>
    </g>
  </g>
</svg>
